<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=wb_sunny,moon_stars,menu,close,home,favorite,settings,logout,notifications,account_circle&display=block" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
    <title>Vintage Cars</title>
</head>
<body>
    <header class="navbar-wrapper">
        <nav class="navbar">
            <div class="navbar__start">
                <button class="btn navbar__theme-toggle" aria-label="Cambiar modo de color">
                    <span class="material-symbols-outlined navbar__icon navbar__icon--toggle">moon_stars</span>
                </button>
                <a href="../index.html" class="link navbar__logo">Vintage Cars</a>
            </div>
            <div class="navbar__end">
                <button class="btn navbar__menu navbar__menu--mobile-only" aria-label="Abrir menu de navegacion">
                    <span class="material-symbols-outlined navbar__icon navbar__icon--big">menu</span>
                </button>
                <ul class="navbar__list">
                    <li class="navbar__item"><button class="btn navbar__close navbar__close--mobile-only" aria-label="Cerrar menu de navegacion">
                        <span class="material-symbols-outlined navbar__icon navbar__icon--big">close</span>
                    </button></li>
                    <li class="navbar__item navbar__item--highlight"><a href="./catalogo.html" class="link navbar__link navbar__link--highlight">Catalogo</a></li>
                    <li class="navbar__item"><a href="../index.html" class="link navbar__link">Inicio</a></li>
                    <li class="navbar__item navbar__item--accent">
                        <button type="button" class="btn navbar__profile">
                            <span class="material-symbols-outlined navbar__icon-profile">logout</span>
                        </button> 
                    </li>
                </ul>
            </div>
        </nav>
    </header>
        <div class="dashboard">
            <aside class="sidebar">
                <a href="#" class="link sidebar__link">
                    Principal
                    <span class="material-symbols-outlined sidebar__icon">home</span>
                </a>
                <a href="#" class="link sidebar__link">
                    Favoritos
                    <span class="material-symbols-outlined sidebar__icon">favorite</span>
                </a>
                <a href="#" class="link sidebar__link">
                    Notificaciones
                    <span class="material-symbols-outlined sidebar__icon">notifications</span>
                </a>
                <a href="#" class="link sidebar__link">
                    Configuracion
                    <span class="material-symbols-outlined sidebar__icon">settings</span>
                </a>
                <button type="button" class="btn sidebar__logout" id="btnLogout">Cerrar Sesion
                    <span class="material-symbols-outlined sidebar__icon">logout</span>
                </button>
            </aside>
            <main class="dashboard__content">
                <h1 class="dashboard__title">
                    Hola, <span class="dashboard__username" id="userName">Juan</span>!
                </h1>
                <section class="kpi">
                    <article class="kpi__card">
                        <span class="kpi__title">Autos Guardados</span>
                        <span class="kpi__value" id="savedCars">6</span>
                    </article>
                    <article class="kpi__card">
                        <span class="kpi__title">Busquedas Recientes</span>
                        <span class="kpi__value" id="savedSearches">1</span>
                    </article>
                    <article class="kpi__card">
                        <span class="kpi__title">Notificaciones</span>
                        <span class="kpi__value" id="userNotifications">2</span>
                    </article>
                </section>
                <section class="panel">
                    <h2 class="panel__title">
                        Coleccion Destacada
                    </h2>
                    <div class="panel__grid">
                        <article class="car-card">
                            <div class="car-card__info">
                                <img src="https://images.unsplash.com/photo-1603909390477-bf6fc90bb68e?q=80&w=1400&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="info-car" class="car-card__img">
                                <h3 class="car-card__title">
                                    Porsche 911
                                </h3>
                                <div class="car-card__year-category">
                                   <span class="car-card__year">1973</span>
                                   <span class="car-card__category">Deportivo Clásico</span>
                                </div>
                            </div>
                            <button type="button" class="btn car-card__btn">
                                Mas informacion!
                            </button>
                        </article>
                    </div>
                </section>
            </main>
        </div>
    <script type="module" src="../js/dashboard.js" defer></script>
</body>
</html>
