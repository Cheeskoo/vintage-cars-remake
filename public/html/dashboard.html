<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=arrow_back,chevron_backward,chevron_forward,close,directions_car,favorite,home,logout,menu,moon_stars,search,tune,wb_sunny&display=block" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="shortcut icon" href="../images/car-icon.ico" type="image/x-icon">
    <title>Mis favoritos | Vintage Cars</title>
</head>
<body>
    <header class="navbar-wrapper">
        <nav class="navbar">
            <div class="navbar__start">
                <button class="btn navbar__theme-toggle" aria-label="Cambiar modo de color">
                    <span class="material-symbols-outlined navbar__icon navbar__icon--toggle">moon_stars</span>
                </button>
                <a href="../index.html" class="link navbar__logo">Vintage Cars</a>
            </div>
            <div class="navbar__end">
                <button class="btn navbar__menu navbar__menu--mobile-only" aria-label="Abrir menu de navegacion">
                    <span class="material-symbols-outlined navbar__icon navbar__icon--big">menu</span>
                </button>
                <ul class="navbar__list">
                    <li class="navbar__item"><button class="btn navbar__close navbar__close--mobile-only" aria-label="Cerrar menu de navegacion">
                        <span class="material-symbols-outlined navbar__icon navbar__icon--big">close</span>
                    </button></li>
                    <li class="navbar__item navbar__item--highlight"><a href="./catalogo.html" class="link navbar__link navbar__link--highlight">Catalogo</a></li>
                    <li class="navbar__item"><a href="../index.html" class="link navbar__link">Inicio</a></li>
                    <li class="navbar__item navbar__item--accent" id="navAuth"></li>
                </ul>
            </div>
        </nav>
    </header>
    <div class="dashboard">
        <aside class="sidebar">
            <a href="../index.html" class="link sidebar__link">
                Inicio
                <span class="material-symbols-outlined sidebar__icon">home</span>
            </a>
            <a href="./catalogo.html" class="link sidebar__link">
                Catalogo
                <span class="material-symbols-outlined sidebar__icon">directions_car</span>
            </a>
            <a href="#favoritos" class="link sidebar__link sidebar__link--active">
                Favoritos
                <span class="material-symbols-outlined sidebar__icon">favorite</span>
            </a>
            <button type="button" class="btn sidebar__logout" id="btnLogout">Cerrar sesion
                <span class="material-symbols-outlined sidebar__icon">logout</span>
            </button>
        </aside>
        <main class="dashboard__content" aria-busy="true">
            <h1 class="dashboard__title">
                Hola, <span class="dashboard__username" id="userName">...</span>!
            </h1>
            <section class="kpi" aria-label="Resumen de tu coleccion">
                <article class="kpi__card">
                    <span class="kpi__title">Autos guardados</span>
                    <span class="kpi__value" id="savedCars">-</span>
                </article>
                <article class="kpi__card">
                    <span class="kpi__title">Disponibles para comprar</span>
                    <span class="kpi__value" id="availableCars">-</span>
                </article>
                <article class="kpi__card">
                    <span class="kpi__title">Valor de tu coleccion</span>
                    <span class="kpi__value" id="collectionValue">-</span>
                </article>
            </section>
            <section class="panel" id="favoritos">
                <h2 class="panel__title">Tus autos favoritos</h2>
                <div class="panel__grid" id="favoritesGrid"></div>
            </section>
        </main>
    </div>
    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
