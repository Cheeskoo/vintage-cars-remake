<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=arrow_back,chevron_backward,chevron_forward,close,directions_car,favorite,home,logout,menu,moon_stars,search,tune,wb_sunny&display=block" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/catalogo.css">
    <link rel="stylesheet" href="../css/auto.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="shortcut icon" href="../images/car-icon.ico" type="image/x-icon">
    <title>Detalle | Vintage Cars</title>
</head>
<body>
    <header class="navbar-wrapper">
        <nav class="navbar">
            <div class="navbar__start">
                <button class="btn navbar__theme-toggle" aria-label="Cambiar modo de color">
                    <span class="material-symbols-outlined navbar__icon navbar__icon--toggle">moon_stars</span>
                </button>
                <a href="../index.html" class="link navbar__logo">Vintage Cars</a>
            </div>
            <div class="navbar__end">
                <button class="btn navbar__menu navbar__menu--mobile-only" aria-label="Abrir menu de navegacion">
                    <span class="material-symbols-outlined navbar__icon navbar__icon--big">menu</span>
                </button>
                <ul class="navbar__list">
                    <li class="navbar__item"><button class="btn navbar__close navbar__close--mobile-only" aria-label="Cerrar menu de navegacion">
                        <span class="material-symbols-outlined navbar__icon navbar__icon--big">close</span>
                    </button></li>
                    <li class="navbar__item navbar__item--highlight"><a href="./catalogo.html" class="link navbar__link navbar__link--highlight">Catalogo</a></li>
                    <li class="navbar__item"><a href="./dashboard.html" class="link navbar__link">Mis favoritos</a></li>
                    <li class="navbar__item navbar__item--accent" id="navAuth"><a href="./login.html" class="link navbar__link navbar__link--accent">Login</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main class="detail-page">
        <div class="detail" id="detail" aria-busy="true">
            <div class="detail__loading skeleton"></div>
        </div>
        <section class="related" id="related" hidden>
            <h2 class="related__title">Tambien te puede interesar</h2>
            <ul class="products__grid related__grid" id="relatedGrid"></ul>
        </section>
    </main>
    <script type="module" src="../js/auto.js"></script>
</body>
</html>
